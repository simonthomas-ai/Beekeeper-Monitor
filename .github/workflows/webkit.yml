name: Safari WebKit and iPhone emulation
on:
  # Safari und iPhone laufen bei Push/PR bereits im Gesamttest.
  # Separater WebKit-Lauf bleibt fuer gezielte Diagnose manuell verfuegbar.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Run Safari-engine WebKit suite
        run: npx playwright test --browser webkit
      - name: Run iPhone WebKit emulation suite
        if: success() || failure()
        run: npx playwright test --config playwright.iphone.config.cjs
      - name: Summarize WebKit coverage
        if: always()
        run: |
          echo '## Safari / iPhone browser checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Playwright WebKit desktop and iPhone 13 emulation. Camera and microphone are mocked, not physical hardware.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WebKit failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
