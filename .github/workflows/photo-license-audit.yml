name: Täglicher Bildlizenz-Abgleich
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-license-audit.yml'
      - 'scripts/check_live_photo_licenses.py'
      - 'review/all.html'
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: read
jobs:
  photo-license-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Aktuelle iNaturalist-Fotolizenzen vergleichen
        run: python scripts/check_live_photo_licenses.py --limit 250 --output photo-license-audit.json
      - name: Prüfbericht archivieren (auch bei Fehlern)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: photo-license-audit
          path: photo-license-audit.json
          if-no-files-found: warn
          retention-days: 30
