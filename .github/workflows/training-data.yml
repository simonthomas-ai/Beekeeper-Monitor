name: Verify real training data
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/**'
      - 'datasets/**'
      - 'scripts/model_readiness.py'
      - '.github/workflows/training-data.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check -r training/requirements-ci-validation.txt
      - name: Dokumentierte KI-Dateninventur
        run: python scripts/model_readiness.py
      - name: Echtdaten auf allen drei Splits validieren
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d datasets/beekeeper ]; then
            echo '## Modellfreigabe: BLOCKIERT – keine Trainingsdaten' >> "$GITHUB_STEP_SUMMARY"
            echo 'Keine realen, lizenzierten und annotierten Daten vorhanden. Es wurde kein Modell trainiert.' >> "$GITHUB_STEP_SUMMARY"
            echo 'NOTICE: Missing dataset; model training remains blocked.'
            exit 0
          fi
          # A partial dataset must not silently bypass provenance and split checks.
          python training/train.py --validate-only
          echo '## Echtdaten: formale Validierung bestanden (keine Modellfreigabe)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unabhängige Felddaten, Modellgewichte und Qualitätsnachweise sind weiterhin erforderlich.' >> "$GITHUB_STEP_SUMMARY"
