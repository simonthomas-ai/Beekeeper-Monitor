name: Verify real training data
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/**'
      - 'datasets/**'
      - '.github/workflows/training-data.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Validate dataset if authentic labeled images are present
        shell: bash
        run: |
          if [ -d datasets/beekeeper/images/train ] && [ -d datasets/beekeeper/labels/train ]; then
            python training/train.py --validate-only
          else
            echo 'SKIPPED: no licensed, annotated dataset committed; no model training claimed.'
          fi
