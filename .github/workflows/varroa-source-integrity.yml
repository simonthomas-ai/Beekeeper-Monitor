name: Varroa upstream source integrity tests
on:
  push:
    paths:
      - 'scripts/verify_varroa_source_blob.py'
      - 'tests/test_verify_varroa_source_blob.py'
      - 'data/model-sources/varrodetector-best.json'
      - '.github/workflows/varroa-source-integrity.yml'
  pull_request:
    paths:
      - 'scripts/verify_varroa_source_blob.py'
      - 'tests/test_verify_varroa_source_blob.py'
      - 'data/model-sources/varrodetector-best.json'
      - '.github/workflows/varroa-source-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline provenance gate using synthetic bytes only
        run: python3 -m unittest discover -s tests -p test_verify_varroa_source_blob.py -v
