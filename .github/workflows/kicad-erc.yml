name: KiCad Schaltplan-ERC
on:
  push:
    branches:
      - hardware/sensoradapter-erc-20261120
      - fix/kicad-erc-footprint-table-20261120
      - fix/kicad-erc-symbol-library-20261120
      - main
    paths:
      - 'hardware/sensoradapter-v01/**'
      - '.github/workflows/kicad-erc.yml'
  pull_request:
    paths:
      - 'hardware/sensoradapter-v01/**'
      - '.github/workflows/kicad-erc.yml'
  workflow_dispatch:
jobs:
  kicad-erc:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KiCad 9 installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          # Projektsymbolbibliothek ist identisch mit den eingebetteten Symbolen.
          LOCAL_SYMBOL_LIB="$PWD/hardware/sensoradapter-v01/VespaGuard_Connector.kicad_sym"
          test -s "$LOCAL_SYMBOL_LIB" || exit 1
          mkdir -p "$HOME/.config/kicad/9.0"
          printf '(sym_lib_table\n  (version 7)\n  (lib (name "VespaGuard_Connector")(type "KiCad")(uri "%s")(options "")(descr "Versionierte VespaGuard-Steckverbinder"))\n)\n' "$LOCAL_SYMBOL_LIB" > "$HOME/.config/kicad/9.0/sym-lib-table"
          kicad-cli sch erc --help
      - name: ERC ausfuehren
        run: |
          mkdir -p build/kicad
          cd hardware/sensoradapter-v01
          mkdir -p "$HOME/.config/kicad/9.0"
          printf '(fp_lib_table\n  (version 7)\n  (lib (name "Connector_PinHeader_2.54mm")(type "KiCad")(uri "%s/Connector_PinHeader_2.54mm.pretty")(options "")(descr "VespaGuard project footprint"))\n)\n' "$PWD" > "$HOME/.config/kicad/9.0/fp-lib-table"
          cd ../..
          # Symboltabelle nicht mit der fremden Standardbibliothek ueberschreiben.
          # Die projektlokale Bibliothek muss beim ERC sichtbar bleiben.
          test -s "$HOME/.config/kicad/9.0/sym-lib-table"
          grep -q 'VespaGuard_Connector' "$HOME/.config/kicad/9.0/sym-lib-table"
          kicad-cli sch erc --exit-code-violations --output build/kicad/erc-report.txt hardware/sensoradapter-v01/sensoradapter-v01.kicad_sch
      - name: ERC-Bericht speichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sensoradapter-kicad-erc
          path: build/kicad/erc-report.txt
          if-no-files-found: warn
