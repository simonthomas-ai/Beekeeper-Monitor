name: Validate PWA staging (no deployment)
# Manual validation only. This workflow contains no Pages upload or deployment action.
# Re-enable only after explicit approval and legal review.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-only:
    name: Validate staged PWA without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check app before publishing
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
          python -m unittest tests.test_field_dataset_zip -v
          python -m unittest training.test_audit_gallery_rights -v
          python -m unittest training.test_public_review_artifact_policy -v
          node --check backup-contract.js
          node --check app.js
          node --check integrations-ui.js
          node --check alert-rules.js
          node --check alert-ui.js
          node --check field-image-privacy.js
          node --check field-dataset.js
          node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
          node --check sw.js
      - name: Stage public PWA files only
        run: |
          mkdir -p _site
          cp index.html datenschutz.html impressum.html style.css backup-contract.js app.js integrations-ui.js alert-rules.js alert-ui.js live-media.js field-image-privacy.js field-dataset.js varroa-ui.js varroa.html sw.js manifest.webmanifest icon.svg _site/
          # Wissenschaftliche Quellen und deutschsprachige Wissensseite veroeffentlichen.
          mkdir -p _site/wissen
          cp wissen/wissenschaft-hornissen-bienen.html _site/wissen/
          cp wissen/weltlage-vespa-velutina.html _site/wissen/
          test -s _site/wissen/wissenschaft-hornissen-bienen.html
          test -s _site/wissen/weltlage-vespa-velutina.html
          grep -q 'Weltweite Verbreitung und Forschungsstand' _site/wissen/weltlage-vespa-velutina.html
          # Public candidate galleries and original media are deliberately withheld.
          mkdir -p _site/review
          cp review/index.html _site/review/index.html
          grep -q 'Öffentliche Fotoprüfung derzeit nicht verfügbar' _site/review/index.html
          grep -q 'id="projektleistung"' _site/index.html
          grep -q '44842498223' _site/index.html
          test -s _site/datenschutz.html
          test -s _site/impressum.html
          touch _site/.nojekyll
      - name: Enforce completed legal notices before any future publication
        run: |
          set -euo pipefail
          # Keep this fail-closed gate after the image audit but before any upload.
          if grep -Eq '\[[^]]+\]' _site/impressum.html _site/datenschutz.html || \
             grep -Eiq 'MUSTER[[:space:]]*/[[:space:]]*PLATZHALTER|Angaben noch unvollständig|Angaben sind derzeit unvollständig' _site/impressum.html _site/datenschutz.html; then
            echo "::error::Rechtstexte enthalten noch Platzhalter; Deployment gesperrt."
            exit 1
          fi
      - name: Verify staged files without publishing
        run: |
          test -s _site/index.html
          test -s _site/datenschutz.html
          test -s _site/impressum.html
          test -s _site/review/index.html
          echo "PASS: local PWA staging validated; no Pages artifact or deployment was created."
