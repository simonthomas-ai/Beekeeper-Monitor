name: Deploy PWA to GitHub Pages
# Public deployment intentionally disabled for private development.
# Re-enable only after explicit approval and legal review.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ false }} # Explicitly disabled: never publish from this workflow
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check app before publishing
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
          python -m unittest tests.test_field_dataset_zip -v
          python -m unittest training.test_audit_gallery_rights -v
          node --check backup-contract.js
          node --check app.js
          node --check integrations-ui.js
          node --check alert-rules.js
          node --check alert-ui.js
          node --check field-dataset.js
          node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
          node --check sw.js
      - name: Stage public PWA files only
        run: |
          mkdir -p _site
          cp index.html datenschutz.html impressum.html style.css backup-contract.js app.js integrations-ui.js alert-rules.js alert-ui.js live-media.js field-dataset.js varroa-ui.js varroa.html sw.js manifest.webmanifest icon.svg _site/
          # Wissenschaftliche Quellen und deutschsprachige Wissensseite veroeffentlichen.
          mkdir -p _site/wissen
          cp wissen/wissenschaft-hornissen-bienen.html _site/wissen/
          cp wissen/weltlage-vespa-velutina.html _site/wissen/
          test -s _site/wissen/wissenschaft-hornissen-bienen.html
          test -s _site/wissen/weltlage-vespa-velutina.html
          grep -q 'Weltweite Verbreitung und Forschungsstand' _site/wissen/weltlage-vespa-velutina.html
          # Public mobile review galleries are generated by the CC0 workflow.
          if [ -d review ]; then
            mkdir -p _site/review
            cp review/{velutina,crabro,apis,bombus,vespula}.html _site/review/
            if [ -f review/all.html ]; then cp review/all.html _site/review/; fi
            # Local-only human photo review interface (no review data uploaded).
            if [ -f review/photos.html ]; then cp review/photos.html _site/review/; fi
          fi
          # Fail closed rather than silently publishing a missing review link.
          # Optional repository-local originals are staged only from the dedicated asset directory.
          # The manifest and byte hashes are validated below; error reports are never published.
          if [ -f public-review-assets/velutina-original-images-manifest.csv ]; then
            cp public-review-assets/velutina-original-images-manifest.csv _site/review/
          fi
          if [ -d public-review-assets/images/velutina ]; then
            mkdir -p _site/review/images
            cp -a public-review-assets/images/velutina _site/review/images/
          fi
          test -s _site/review/all.html
          grep -q "vespaguard-unverified-mobile-review-v1" _site/review/all.html
          grep -q 'id="projektleistung"' _site/index.html
          grep -q '44842498223' _site/index.html
          test -s _site/datenschutz.html
          test -s _site/impressum.html
          touch _site/.nojekyll
      - name: Resolve latest successful CC0 original-image artifact
        id: original-run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$TRIGGERING_RUN_ID"
          else
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ki-cc0-quellen.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          fi
          if [[ -n "$run_id" ]]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "Selected successful CC0 original-image run: $run_id"
          else
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "No successful CC0 image artifact exists; local references will fail the mandatory audit."
          fi
      - name: Download local original-image files and manifest
        if: steps.original-run.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: original-velutina-images
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.original-run.outputs.run_id }}
          path: _site/review
      - name: Verify gallery metadata and unchanged local original bytes
        run: python scripts/audit_gallery_rights.py --root _site
      - name: Enforce completed legal notices before Pages upload
        run: |
          set -euo pipefail
          # Keep this fail-closed gate after the image audit but before any upload.
          if grep -Eq '\[[^]]+\]' _site/impressum.html _site/datenschutz.html || \
             grep -Eiq 'MUSTER[[:space:]]*/[[:space:]]*PLATZHALTER|Angaben noch unvollständig|Angaben sind derzeit unvollständig' _site/impressum.html _site/datenschutz.html; then
            echo "::error::Rechtstexte enthalten noch Platzhalter; Deployment gesperrt."
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Wait for uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -Eq '^[0-9]+$'; then
              echo "Pages artifact is available through the Actions API."
              exit 0
            fi
            echo "Pages artifact not yet visible (attempt ${attempt}/12); retrying in 5 seconds."
            sleep 5
          done
          echo "::error::Uploaded github-pages artifact did not become visible within 60 seconds."
          exit 1
      # GitHub's Actions artifacts API can list a newly uploaded artifact before
      # the deploy-pages artifact service can retrieve its metadata.
      - name: Allow Pages artifact metadata to propagate
        run: sleep 45
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Oeffentliche Website und Rechtstexte nach Deployment kontrollieren
        run: |
          python - <<'PY'
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "https://simonthomas-ai.github.io/Beekeeper-Monitor/"
          checks = {
              "": "id=\"projektleistung\"",
              "wissen/wissenschaft-hornissen-bienen.html": "Forschung und Fachquellen aus Asien",
              "wissen/weltlage-vespa-velutina.html": "Weltweite Verbreitung und Forschungsstand",
          }
          for path in ("impressum.html", "datenschutz.html"):
              checks[path] = None
          for path, marker in checks.items():
              url = base + path
              for attempt in range(12):
                  try:
                      with urlopen(Request(url, headers={"User-Agent": "VespaGuard-Deployment-Check/1.0", "Cache-Control": "no-cache"}), timeout=20) as response:
                          body = response.read().decode("utf-8")
                          legal = path in ("impressum.html", "datenschutz.html")
                          placeholders = bool(re.search(r"\[[^]]+\]|MUSTER\s*/\s*PLATZHALTER|Angaben (?:noch|sind derzeit) unvollständig", body, re.IGNORECASE))
                          if response.status == 200 and ((not placeholders and bool(body.strip())) if legal else marker in body):
                              print(f"OK HTTP 200 and expected content: {url}", flush=True)
                              break
                          print(f"Unexpected response or content: {url} (attempt {attempt + 1}/12)", flush=True)
                  except (HTTPError, URLError, TimeoutError) as exc:
                      print(f"Attempt {attempt + 1}/12 for {url}: {exc}", flush=True)
                  if attempt < 11:
                      time.sleep(10)
              else:
                  raise SystemExit(f"Public page not verified after deployment: {url}")
          PY
