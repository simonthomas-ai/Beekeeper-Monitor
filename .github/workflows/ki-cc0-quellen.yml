name: Echte CC0-Bildquellen fuer KI pruefen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/discover_cc0_candidates.py'
      - 'training/test_discover_cc0_candidates.py'
      - 'training/prepare_visual_review_gallery.py'
      - '.github/workflows/ki-cc0-quellen.yml'
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline-Test der paginierten Bildrecherche
        run: python3 -m unittest training.test_discover_cc0_candidates -v
      - name: iNaturalist CC0-Metadaten recherchieren (keine KI-Freigabe)
        run: python3 training/discover_cc0_candidates.py --per-species 50
      - name: Lizenz- und Dublettenpruefung
        run: python3 training/audit_inaturalist_candidates.py --input training/inaturalist-review-queue.csv --output training/inaturalist-metadata-audit.json
      - name: Artenpruefung vorbereiten
        run: python3 training/prepare_species_review.py --input training/inaturalist-review-queue.csv --output training/inaturalist-species-review.csv
      - name: Hornissen-Fotometadaten einzeln gegen iNaturalist pruefen
        run: python3 training/verify_inaturalist_photo_metadata.py --input training/inaturalist-review-queue.csv --output training/velutina-photo-verification.csv --species 'Vespa velutina' --limit 50
      - name: Visuelle Pruefgalerie fuer echte Hornissenbilder erstellen
        run: python3 training/prepare_visual_review_gallery.py --input training/inaturalist-review-queue.csv --output training/velutina-visual-review.html
      - name: Pruefgalerie fuer alle fuenf Arten erstellen
        run: |
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-review-queue.csv --output training/velutina-visual-review.html --species 'Vespa velutina'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-review-queue.csv --output training/crabro-visual-review.html --species 'Vespa crabro'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-review-queue.csv --output training/apis-visual-review.html --species 'Apis mellifera'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-review-queue.csv --output training/bombus-visual-review.html --species 'Bombus terrestris'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-review-queue.csv --output training/vespula-visual-review.html --species 'Vespula vulgaris'
      - name: Mobile Bildpruefung auf GitHub Pages bereitstellen
        if: success()
        run: |
          set -euo pipefail
          mkdir -p review
          for species in velutina crabro apis bombus vespula; do
            cp "training/${species}-visual-review.html" "review/${species}.html"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/velutina.html review/crabro.html review/apis.html review/bombus.html review/vespula.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish unreviewed mobile species galleries [skip ci]"
            # Other workflows may push to main during image discovery.
            # Rebase only this generated-gallery commit, then retry.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Five mobile galleries published to main."
                exit 0
              fi
              echo "Concurrent push detected (attempt ${attempt}/5); retrying."
              sleep 3
            done
            echo "Could not publish galleries after five retries."
            exit 1
          fi
      - name: Ergebnis
        if: always()
        run: |
          echo '## KI-Bildquellen – Recherche, keine Trainingsfreigabe' >> "$GITHUB_STEP_SUMMARY"
          if [ -f training/inaturalist-review-queue.csv ]; then
            echo "Ungepruefte CC0-Fotokandidaten: $(($(wc -l < training/inaturalist-review-queue.csv)-1))" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f training/velutina-photo-verification.csv ]; then
            echo '### Einzelpruefung Asiatische Hornisse' >> "$GITHUB_STEP_SUMMARY"
            python3 -c 'import csv; p="training/velutina-photo-verification.csv"; r=list(csv.DictReader(open(p))); ok=sum(x["api_photo_found"]=="YES" and x["license_metadata_match"]=="YES" and x["api_taxon"]=="Vespa velutina" and x["api_quality_grade"]=="research" for x in r); print(f"API-Metadaten bestaetigt: {ok}/{len(r)}; visuelle Artenpruefung weiterhin offen")' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Keine Bilder heruntergeladen. Keine Artenbestimmung fachlich verifiziert. Keine Annotationen erzeugt. 0 freigegebene Trainingsbilder; keine gemessene Modellgenauigkeit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Metadaten und Prueflisten bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ki-cc0-quellen-prueflisten
          path: |
            training/inaturalist-review-queue.csv
            training/inaturalist-metadata-audit.json
            training/inaturalist-species-review.csv
            training/inaturalist-species-review.json
            training/velutina-photo-verification.csv
            training/*-visual-review.html
          if-no-files-found: ignore
