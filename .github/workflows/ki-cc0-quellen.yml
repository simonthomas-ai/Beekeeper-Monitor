name: Echte CC0-Bildquellen fuer KI pruefen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'training/discover_cc0_candidates.py'
      - 'training/test_discover_cc0_candidates.py'
      - 'training/prepare_visual_review_gallery.py'
      - 'training/screen_inaturalist_image_quality.py'
      - 'training/test_screen_inaturalist_image_quality.py'
      - 'training/download_original_inaturalist_images.py'
      - 'training/test_download_original_inaturalist_images.py'
      - 'training/verify_inaturalist_photo_metadata.py'
      - 'training/test_verify_inaturalist_photo_metadata.py'
      - 'training/audit_inaturalist_candidates.py'
      - 'training/test_audit_inaturalist_candidates.py'
      - 'training/test_prepare_visual_review_gallery.py'
      - 'scripts/audit_gallery_rights.py'
      - 'training/test_audit_gallery_rights.py'
      - 'training/test_public_review_artifact_policy.py'
      - '.github/workflows/ki-cc0-quellen.yml'
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Pillow for transient in-memory image inspection
        run: |
          python3 -m pip install --only-binary=:all: 'Pillow>=10,<13'
      - name: Offline-Test der Bildqualitaetspruefung
        run: python3 -m unittest training.test_screen_inaturalist_image_quality -v
      - name: Offline-Test der paginierten Bildrecherche und Bildquellen-Normalisierung
        run: python3 -m unittest training.test_discover_cc0_candidates -v
      - name: Offline-Test des bytegenauen Originalbild-Downloads
        run: python3 -m unittest training.test_download_original_inaturalist_images -v
      - name: Offline-Test der getrennten Beobachter- und CC0-Attributionsdaten
        run: python3 -m unittest training.test_verify_inaturalist_photo_metadata training.test_discover_cc0_candidates training.test_audit_inaturalist_candidates -v
      - name: Offline-Test der sicheren Galeriegenerierung
        run: python3 -m unittest training.test_prepare_visual_review_gallery -v
      - name: Offline-Test des lokalen Originalbild-Rechte- und SHA-256-Audits
        run: python3 -m unittest training.test_audit_gallery_rights -v
      - name: Policy-Test gegen oeffentliche Originalbild-Artefakte
        run: python3 -m unittest training.test_public_review_artifact_policy -v
      - name: iNaturalist CC0-Metadaten recherchieren (100 Kandidaten je Art, keine KI-Freigabe)
        run: python3 training/discover_cc0_candidates.py --per-species 100
      - name: Lizenz- und Dublettenpruefung
        run: python3 training/audit_inaturalist_candidates.py --input training/inaturalist-review-queue.csv --output training/inaturalist-metadata-audit.json
      - name: Artenpruefung vorbereiten
        run: python3 training/prepare_species_review.py --input training/inaturalist-review-queue.csv --output training/inaturalist-species-review.csv
      - name: Hornissen-Fotometadaten einzeln gegen iNaturalist pruefen
        run: python3 training/verify_inaturalist_photo_metadata.py --input training/inaturalist-review-queue.csv --output training/velutina-photo-verification.csv --species 'Vespa velutina' --limit 100
      - name: Originalbild-Dateien temporaer auf Groesse und Lesbarkeit pruefen
        run: python3 training/screen_inaturalist_image_quality.py --input training/inaturalist-review-queue.csv --output training/inaturalist-quality-screen.csv --pause 0.15 --timeout 15
      - name: Unveraenderte CC0-Originaldateien fuer Vespa velutina herunterladen
        run: |
          mkdir -p public-review-assets/images/velutina
          python3 training/download_original_inaturalist_images.py \
            --input training/inaturalist-quality-screen.csv \
            --verification training/velutina-photo-verification.csv \
            --species 'Vespa velutina' \
            --output-dir public-review-assets/images/velutina \
            --manifest public-review-assets/velutina-original-images-manifest.csv
      - name: Pruefgalerie fuer alle fuenf Arten erstellen
        run: |
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-quality-screen.csv --output training/velutina-visual-review.html --species 'Vespa velutina'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-quality-screen.csv --output training/crabro-visual-review.html --species 'Vespa crabro'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-quality-screen.csv --output training/apis-visual-review.html --species 'Apis mellifera'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-quality-screen.csv --output training/bombus-visual-review.html --species 'Bombus terrestris'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-quality-screen.csv --output training/vespula-visual-review.html --species 'Vespula vulgaris'
          python3 training/prepare_visual_review_gallery.py --input training/inaturalist-quality-screen.csv --output training/all-visual-review.html --species ALL
      - name: Originalbildbytes nach temporaerer Pruefung entfernen
        if: always()
        run: rm -rf public-review-assets
      - name: Ergebnis
        if: always()
        run: |
          echo '## KI-Bildquellen – Recherche, keine Trainingsfreigabe' >> "$GITHUB_STEP_SUMMARY"
          if [ -f training/inaturalist-review-queue.csv ]; then
            echo "Ungepruefte CC0-Fotokandidaten: $(($(wc -l < training/inaturalist-review-queue.csv)-1))" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f training/velutina-photo-verification.csv ]; then
            echo '### Einzelpruefung Asiatische Hornisse' >> "$GITHUB_STEP_SUMMARY"
            python3 -c 'import csv; p="training/velutina-photo-verification.csv"; r=list(csv.DictReader(open(p))); ok=sum(x["api_photo_found"]=="YES" and x["license_metadata_match"]=="YES" and x["api_taxon"]=="Vespa velutina" and x["api_quality_grade"]=="research" for x in r); print(f"API-Metadaten bestaetigt: {ok}/{len(r)}; visuelle Artenpruefung weiterhin offen")' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Bilddateien nur temporär im Arbeitsspeicher geprüft, keine Bildbytes gespeichert. Keine Artbestimmung fachlich verifiziert. Keine Annotationen erzeugt. 0 freigegebene Trainingsbilder; keine gemessene Modellgenauigkeit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Generierte Review-Metadaten nach Ergebnisbericht entfernen
        if: always()
        run: |
          rm -f training/inaturalist-review-queue.csv
          rm -f training/inaturalist-quality-screen.csv
          rm -f training/inaturalist-metadata-audit.json
          rm -f training/inaturalist-species-review.csv
          rm -f training/inaturalist-species-review.json
          rm -f training/velutina-photo-verification.csv
          rm -f training/*-visual-review.html
