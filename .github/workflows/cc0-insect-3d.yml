name: CC0 insect 3D candidate discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/discover_cc0_3d_models.py'
      - 'training/test_discover_cc0_3d_models.py'
      - '.github/workflows/cc0-insect-3d.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test safe license and species filters
        run: python -m unittest discover -s training -p 'test_discover_cc0_3d_models.py' -v
      - name: Inventory Smithsonian CC0 insect models
        run: python training/discover_cc0_3d_models.py
      - name: Upload review-only inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc0-insect-3d-review
          path: training/cc0-3d-insect-candidates.csv
          if-no-files-found: warn
          retention-days: 14
