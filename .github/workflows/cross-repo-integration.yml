name: VespaGuard Repository-Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cross-repo-integration.yml'
      - 'integrations/**'
      - 'scripts/test_practical_modules_http.py'
      - 'docs/VESPAGUARD-INTEGRATION.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cross-repo-integration.yml'
      - 'integrations/**'
      - 'docs/VESPAGUARD-INTEGRATION.md'
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  source-bridge-receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Monitor auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monitor
          persist-credentials: false
      - name: BeeKeeper3000 auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simonthomas-ai/BeeKeeper3000
          # Immutable partner revision; update deliberately after its CI passes.
          ref: 05257986edff26d2e05b0826693f4d8bad8ec0a6
          path: beekeeper3000
          persist-credentials: false
      - name: Python vorbereiten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Node.js vorbereiten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Quell-API und Empfänger einzeln prüfen
        run: |
          cd beekeeper3000
          python -m unittest network.test_source_api -v
          cd ../monitor
          python -m unittest discover -s integrations -p 'test_*.py' -v
      - name: Bridge-Vertrag und Zuverlässigkeit prüfen
        working-directory: beekeeper3000/monitor-bridge
        run: npm test
      - name: Echte HTTP-Brücke zum lokalen Empfänger und Replay prüfen
        working-directory: monitor
        run: python -m unittest scripts.test_cross_repo_smoke scripts.test_practical_modules_http -v
      - name: Integrierte Tests dokumentieren
        if: always()
        run: |
          echo '## VespaGuard: Repository-übergreifende Prüfung' >> "$GITHUB_STEP_SUMMARY"
          echo 'Monitor commit: '$(git -C monitor rev-parse HEAD) >> "$GITHUB_STEP_SUMMARY"
          echo 'BeeKeeper3000 partner commit: 05257986edff26d2e05b0826693f4d8bad8ec0a6' >> "$GITHUB_STEP_SUMMARY"
          echo 'Der Partnerstand ist absichtlich auf einen unveränderlichen Commit gepinnt; Änderungen daran benötigen eine bewusste Aktualisierung dieses Workflows.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Diese Prüfung ist noch kein Feldtest mit echter Kamera, Funkhardware oder freigegebenem KI-Modell.' >> "$GITHUB_STEP_SUMMARY"
