name: Audit European apiary taxa
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/european-apiary-priority-taxa.csv'
      - 'training/audit_european_taxa.py'
      - '.github/workflows/european-taxa.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match names against Catalogue of Life XR
        run: python training/audit_european_taxa.py
      - name: Upload audit for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: european-apiary-taxon-audit
          path: training/european-apiary-taxonomy-audit.csv
          if-no-files-found: ignore
