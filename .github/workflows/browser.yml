name: Browser integration tests
on:
  # Manuell ausfuehrbarer gezielter Browsertest.
  # Bei Push/PR prueft der Ein-Klick-Gesamttest bereits Chromium.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Verify bundled Chromium
        run: npx playwright --version
      - name: Run pure PWA contract regression tests
        run: node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
      - name: Run full Chromium integration suite
        run: npm run test:e2e
      - name: Record browser test outcome
        if: always()
        shell: bash
        run: |
          echo '## Browser integration tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'The test run above is authoritative; inspect logs and artifacts for failures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage: persistence, JSON export/import, duplicate prevention, offline use, deletion, HTML injection, GPS denial, invalid files.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
