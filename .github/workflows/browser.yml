name: Browser integration tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run full Chromium integration suite
        run: npm run test:e2e
      - name: Record browser test outcome
        if: always()
        shell: bash
        run: |
          echo '## Browser integration tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'The test run above is authoritative; inspect logs and artifacts for failures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage: persistence, JSON export/import, duplicate prevention, offline use, deletion, HTML injection, GPS denial, invalid files.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
