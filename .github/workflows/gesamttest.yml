name: Ein-Klick-Gesamttest
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gesamttest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - name: Python-Abhaengigkeiten fuer KI-Pruefung
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/vespaguard-python-validation
          echo "/tmp/vespaguard-python-validation/bin" >> "$GITHUB_PATH"
          /tmp/vespaguard-python-validation/bin/python -m pip install --disable-pip-version-check -r training/requirements-ci-validation.txt
          /tmp/vespaguard-python-validation/bin/python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          /tmp/vespaguard-python-validation/bin/pip-audit --requirement training/requirements-ci-validation.txt --strict
          /tmp/vespaguard-python-validation/bin/python -c 'import yaml; from PIL import Image; print("PyYAML:", yaml.__version__, "Pillow:", Image.__version__)'
      - name: PWA, Quellcode und Datenquellen
        id: static
        continue-on-error: true
        run: |
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m unittest scripts.test_audit_workflow_action_pins -v
          python3 -m unittest scripts.test_cc0_workflow_publication_policy -v
          python3 -m unittest training.test_public_review_artifact_policy -v
          python3 -m unittest scripts.test_bridge_partner_pins -v
          python3 scripts/audit_workflow_action_pins.py
          python3 scripts/check_sources.py
          python3 scripts/test_static.py
          python3 -m unittest training.test_validate_reviewed_annotations -v
          python3 -m unittest tests.test_field_dataset_zip -v
          python3 -m py_compile scripts/model_readiness.py
          node --check app.js
          node --check field-image-privacy.js
          node --check field-dataset.js
          node --check sw.js
      - name: Privacy-summary contract tests (blocking)
        run: node --test tests/backup-contract.test.cjs
      - name: Kamera-Modellkatalog (fail-closed, ohne Inferenz)
        run: |
          node --check camera-model-selector.js
          node --test tests/camera-model-selector.unit.cjs
      - name: Warnregeln und Bridge-Kandidaten (Node Unit-Tests)
        id: alerttests
        continue-on-error: true
        run: node --test tests/alert-rules.test.cjs
      - name: Browser-Integrationstests
        id: browser
        continue-on-error: true
        run: npm run test:e2e
      - name: Safari-WebKit-Browsertests
        id: webkit
        continue-on-error: true
        run: npx playwright test --browser webkit
      - name: iPhone-WebKit-Emulation
        id: iphone
        if: always()
        continue-on-error: true
        run: npx playwright test --config playwright.iphone.config.cjs
      - name: Sicherheits- und Lizenzprotokolltests des Bildimports
        id: importtests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s training -p 'test_inaturalist_media.py' -v
          python3 -m unittest discover -s training -p 'test_import_authorized_images.py' -v
          python3 -m unittest discover -s training -p 'test_audit_inaturalist_candidates.py' -v
          python3 -m unittest training.test_audit_cc0_candidates -v
          python3 -m unittest discover -s training -p 'test_prepare_hornet_visual_review.py' -v
          python3 -m unittest discover -s training -p 'test_prepare_visual_review_gallery.py' -v
          python3 -m unittest discover -s training -p 'test_render_hornet_review_gallery.py' -v
          python3 -m unittest discover -s training -p 'test_stage_mobile_reviews.py' -v
          python3 -m unittest discover -s training -p 'test_stage_iphone_csv_reviews.py' -v
          python3 -m unittest discover -s training -p 'test_prepare_gbif_review_gallery.py' -v
          python3 -m unittest discover -s training -p 'test_import_gbif_visual_reviews.py' -v
          python3 -m unittest discover -s training -p 'test_audit_gallery_rights.py' -v
          python3 -m unittest training.test_provenance -v
          python3 -m unittest training.test_train -v
      - name: KI-Dateninventur
        id: model
        continue-on-error: true
        run: python3 scripts/model_readiness.py
      - name: Europaeische Artenliste und Taxonomie
        id: taxonomy
        continue-on-error: true
        run: python3 training/audit_european_taxa.py --output training/european-apiary-taxonomy-audit.csv
      - name: KI-Trainingsdaten und Annotationen
        id: training
        continue-on-error: true
        run: python3 training/train.py --validate-only
      - name: Annotationspruefer und echte Review-Datei
        id: annotations
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile training/validate_reviewed_annotations.py training/prepare_annotation_tasks.py training/prepare_species_review.py training/audit_inaturalist_candidates.py training/prepare_hornet_visual_review.py training/verify_inaturalist_photo_metadata.py training/stage_mobile_reviews.py
          if [ -f training/reviewed-annotations.json ]; then
            python3 training/validate_reviewed_annotations.py training/reviewed-annotations.json
          else
            echo "BLOCKIERT: Keine fachlich freigegebenen Annotationen unter training/reviewed-annotations.json"
            exit 1
          fi
      - name: Lokaler PWA-Vertragscheck (ohne oeffentliche Website)
        id: site
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_pwa_deployment_contract.py
          for asset in index.html app.js live-media.js style.css sw.js manifest.webmanifest icon.svg; do
            test -s "$asset"
          done
      - name: Einheitlicher Ergebnisbericht
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          ALERTTESTS: ${{ steps.alerttests.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          WEBKIT: ${{ steps.webkit.outcome }}
          IPHONE: ${{ steps.iphone.outcome }}
          MODEL: ${{ steps.model.outcome }}
          IMPORTTESTS: ${{ steps.importtests.outcome }}
          TAXONOMY: ${{ steps.taxonomy.outcome }}
          TRAINING: ${{ steps.training.outcome }}
          ANNOTATIONS: ${{ steps.annotations.outcome }}
          SITE: ${{ steps.site.outcome }}
        run: |
          echo '# Beekeeper-Monitor Gesamttest' >> "$GITHUB_STEP_SUMMARY"
          echo '## Software-Funktionstests (entscheidend für CI)' >> "$GITHUB_STEP_SUMMARY"
          echo '| Prüfung | Ergebnis |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo "| PWA und Quellcode | $STATIC |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warnregeln und Bridge-Kandidaten | $ALERTTESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chromium (dynamische Testsuite) | $BROWSER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Safari WebKit (dynamische Testsuite) | $WEBKIT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iPhone-WebKit-Emulation (dynamische Testsuite) | $IPHONE |" >> "$GITHUB_STEP_SUMMARY"
          echo 'Hinweis: Ein grüner Gesamttest bestätigt die verpflichtenden Software- und Bridge-Prüfungen, nicht die Einsatzreife eines KI-Modells.' >> "$GITHUB_STEP_SUMMARY"
          echo '## KI-Forschungsstand (nicht als einsatzbereit freigegeben)' >> "$GITHUB_STEP_SUMMARY"
          echo "| KI-Dateninventur | $MODEL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bildimport-Sicherheit und Herkunftsnachweise | $IMPORTTESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Europäische Taxonomie (Online-API) | $TAXONOMY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Echte KI-Trainingsdaten und Annotationen | $TRAINING |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fachlich geprüfte Annotationseinträge | $ANNOTATIONS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lokale PWA-Dateien und Deployment-Vertrag (kein Online-Test) | $SITE |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TRAINING" != success ] || [ "$ANNOTATIONS" != success ]; then
            echo '### KI-STATUS: BLOCKIERT – keine freigegebenen Trainingsdaten/Annotationen; keine einsatzfähige automatische Erkennung.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$TRAINING" = success ] && [ "$ANNOTATIONS" = success ]; then
            echo 'KI-DATENSTATUS: Daten- und Annotationsprüfungen erfolgreich; dies ist KEINE Modell- oder Feldfreigabe.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'KI-DATENSTATUS: BLOCKIERT; keine Modell- oder Feldfreigabe.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Fehlende Trainingsdaten blockieren die Modellfreigabe. Eine erfolgreiche Inventur belegt keine KI-Genauigkeit, SMS-Zustellung oder Hardwarefunktion.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Trainingsdaten und fachliche Annotationen werden dokumentiert, sind aber absichtlich KEINE verpflichtenden CI-Erfolgskriterien; ihren Status separat beachten.' >> "$GITHUB_STEP_SUMMARY"
      - name: Gemeinsamer Modellkatalog - Hornissen und Varroa (verpflichtend)
        run: |
          python3 -m unittest discover -s tests -p 'test_model_catalog.py' -v
          python3 scripts/check_model_catalog.py
      - name: Freigabesperre automatisch pruefen (verpflichtend)
        run: |
          python3 -m unittest discover -s tests -p 'test_release_gate_report.py' -v
          python3 -m unittest discover -s tests -p 'test_check_field_release.py' -v
      - name: Freigabebericht (CI-Ergebnisse getrennt von rechtlicher Freigabe)
        if: always()
        env:
          STATIC_STATUS: ${{ steps.static.outcome }}
          ALERT_STATUS: ${{ steps.alerttests.outcome }}
          BROWSER_STATUS: ${{ steps.browser.outcome }}
          WEBKIT_STATUS: ${{ steps.webkit.outcome }}
          IPHONE_STATUS: ${{ steps.iphone.outcome }}
          SITE_STATUS: ${{ steps.site.outcome }}
          MODEL_STATUS: ${{ steps.model.outcome }}
          IMPORT_STATUS: ${{ steps.importtests.outcome }}
          TAXONOMY_STATUS: ${{ steps.taxonomy.outcome }}
          TRAINING_STATUS: ${{ steps.training.outcome }}
          ANNOTATIONS_STATUS: ${{ steps.annotations.outcome }}
        run: python3 scripts/release_gate_report.py
      # Browser traces, screenshots and taxonomy exports remain on the ephemeral runner.
      # Only the sanitized step summary is retained; this workflow uploads no public artifacts.
      - name: Gesamtergebnis
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          ALERTTESTS: ${{ steps.alerttests.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          WEBKIT: ${{ steps.webkit.outcome }}
          IPHONE: ${{ steps.iphone.outcome }}
          MODEL: ${{ steps.model.outcome }}
          IMPORTTESTS: ${{ steps.importtests.outcome }}
          TAXONOMY: ${{ steps.taxonomy.outcome }}
          TRAINING: ${{ steps.training.outcome }}
          ANNOTATIONS: ${{ steps.annotations.outcome }}
          SITE: ${{ steps.site.outcome }}
        run: |
          test "$STATIC" = success
          test "$ALERTTESTS" = success
          test "$BROWSER" = success
          test "$WEBKIT" = success
          test "$IPHONE" = success
          test "$MODEL" = success
          test "$IMPORTTESTS" = success
          # Online-Taxonomie ist eine Forschungs-/Datenprüfung, kein Offline-Software-Gate.
          # Ergebnis bleibt im Bericht sichtbar, blockiert aber nicht die lokale PWA-CI.
          test "$SITE" = success

  beekeeper3000-bridge:
    name: BeeKeeper3000 – Bridge-Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: BeeKeeper3000 auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simonthomas-ai/BeeKeeper3000
          # Pin the integration partner to a reviewed commit; avoid moving-main CI drift.
          ref: f7b6060951969203b7efdd5fe85f159de40c043e
          path: beekeeper3000
          persist-credentials: false
      - name: Verify pinned BeeKeeper3000 revision
        run: test "$(git -C beekeeper3000 rev-parse HEAD)" = "f7b6060951969203b7efdd5fe85f159de40c043e"
      - name: Beekeeper-Monitor fuer repo-uebergreifenden Vertrag auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monitor
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verwendete BeeKeeper3000-Version dokumentieren
        run: git -C beekeeper3000 rev-parse HEAD
      - name: Bridge-Abhaengigkeiten reproduzierbar installieren
        run: npm --prefix beekeeper3000/monitor-bridge ci --ignore-scripts --no-audit --no-fund
      - name: Offline Outbox Kapazitaet, Neustart und Datenintegritaet
        run: |
          PYTHONPATH=beekeeper3000 python3 -m unittest discover -s beekeeper3000/camera -p 'test_outbox.py' -v
      - name: Offline HTTP Recovery (echter Loopback-Server und SQLite-Neustart)
        run: |
          PYTHONPATH=beekeeper3000 python3 -m unittest discover -s beekeeper3000/camera -p 'test_offline_http_recovery.py' -v
      - name: BeeKeeper3000-Bridge-Tests
        run: npm --prefix beekeeper3000/monitor-bridge test
      - name: Repo-uebergreifender Bridge-Vertrag bis zur Warnregel
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { toMonitorEvent } from './beekeeper3000/monitor-bridge/bridge.mjs';
          import { createRequire } from 'node:module';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const require = createRequire(import.meta.url);
          const rules = require('./monitor/alert-rules.js');
          const timestamp = new Date().toISOString();
          const event = toMonitorEvent({
            id: 'cross-repo-velutina-1', observed_at: timestamp,
            station_id: 'Yard Cam / North', species: 'Vespa velutina',
            confidence: 1, status: 'expert_confirmed',
            image_path: '/private/secret.jpg', lat: 51.2, lon: 6.8
          });
          if (!event) throw new Error('Bridge rejected source event');
          const check = spawnSync('python3', ['-c',
            'import sys; from integrations.event_contracts import HiveEvent; HiveEvent.from_json(sys.stdin.read())'
          ], { input: JSON.stringify(event), encoding: 'utf8', cwd: 'monitor' });
          if (check.status !== 0) throw new Error('Monitor contract rejected bridge output: ' + check.stderr);
          const id = createHash('sha256').update(JSON.stringify(event)).digest('hex');
          const row = { event_id: id, received_at: timestamp, event };
          const alerts = rules.selectAlerts([row], {enabled:true, thresholdPercent:100}, new Set(), Date.now()).alerts;
          if (alerts.length !== 1 || !rules.describe(alerts[0]).includes('unbestätigt'))
            throw new Error('Bridge event did not reach unverified alert rule');
          if (JSON.stringify(event).includes('secret.jpg') || 'lat' in event.payload || 'lon' in event.payload)
            throw new Error('Bridge leaked media or GPS metadata');
          const other = toMonitorEvent({id:'cross-repo-crabro-1',observed_at:timestamp,station_id:'Yard Cam / North',species:'Vespa crabro',confidence:1});
          const otherRow = {event_id:'a'.repeat(64),received_at:timestamp,event:other};
          if (rules.selectAlerts([otherRow],{enabled:true},new Set(),Date.now()).alerts.length)
            throw new Error('Native hornet must not trigger velutina warning');
          console.log('PASS: BeeKeeper3000 source -> bridge -> Monitor Python contract -> JS warning rule');
          NODE
      - name: Ergebnis im gemeinsamen Bericht
        if: always()
        run: |
          echo '## BeeKeeper3000 Bridge-Integration' >> "$GITHUB_STEP_SUMMARY"
          echo 'Die Bridge-Tests laufen als eigener verpflichtender Job dieses Ein-Klick-Gesamttests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Dies ist kein Nachweis für Kamera-Hardware oder validierte KI-Modelle.' >> "$GITHUB_STEP_SUMMARY"

  field-dataset-contract:
    name: Field-Dataset-Export gegen BeeKeeper-Validator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: BeeKeeper3000 mit geprüftem Rechtevalidator auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simonthomas-ai/BeeKeeper3000
          ref: f7b6060951969203b7efdd5fe85f159de40c043e
          path: beekeeper3000
          persist-credentials: false
      - name: Verify pinned BeeKeeper3000 revision
        run: test "$(git -C beekeeper3000 rev-parse HEAD)" = "f7b6060951969203b7efdd5fe85f159de40c043e"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Monitor-Browserabhaengigkeiten reproduzierbar installieren
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strikten BeeKeeper-Datensatzvalidator separat testen
        working-directory: beekeeper3000
        run: python3 -m unittest training.test_multilabel_dataset -v
      - name: BeeKeeper-Provenienzkonverter separat testen (synthetische Fixtures)
        working-directory: beekeeper3000
        run: python3 -m unittest training.test_build_provenance -v
      - name: Tatsächlichen PWA-ZIP-Export gegen Validator und Provenienzkonverter prüfen
        env:
          BEEKEEPER_MULTILABEL_VALIDATOR: ${{ github.workspace }}/beekeeper3000/training/multilabel_dataset.py
        run: npx playwright test tests/field-dataset.spec.cjs
      - name: Monitor-Fixture-Roundtrip gegen denselben Validator prüfen
        env:
          BEEKEEPER_MULTILABEL_VALIDATOR: ${{ github.workspace }}/beekeeper3000/training/multilabel_dataset.py
        run: python3 -m unittest tests.test_beekeeper_importer_roundtrip -v
