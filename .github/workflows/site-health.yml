name: Public site health
on:
  workflow_dispatch:
  # Kein taeglicher Online-Check: oeffentliche Pages-Verteilung ist deaktiviert.
  # Bei ausdruecklich freigegebener Veroeffentlichung manuell pruefen.
permissions:
  contents: read
jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://simonthomas-ai.github.io/Beekeeper-Monitor/"
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 40 --silent --show-error "$URL" -o index.html
          grep -q 'Beekeeper Monitor' index.html
          for asset in app.js style.css sw.js manifest.webmanifest icon.svg datenschutz.html impressum.html; do
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 40 --silent --show-error "${URL}${asset}" -o /dev/null
          done
          echo "Public site and five static assets reachable."
