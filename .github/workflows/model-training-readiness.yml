name: AI model training readiness
on:
  workflow_dispatch:
  push:
    paths:
      - 'datasets/**'
      - 'training/**'
      - '.github/workflows/model-training-readiness.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset validation dependency
        run: python -m pip install PyYAML
      - name: Verify authentic labeled train, validation and test data
        run: python training/train.py --validate-only
      - name: Explain blocked training
        if: failure()
        run: |
          echo '## Model training blocked' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real annotated train/val/test images for all six classes are required.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No model weights or accuracy are claimed.' >> "$GITHUB_STEP_SUMMARY"
