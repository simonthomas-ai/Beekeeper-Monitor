name: Privater PWA-Build (nur GitHub-Artefakt)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  private-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grundpruefungen
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
          node --check app.js
          node --check field-dataset.js
          node --check sw.js
          node --check hornet-onnx-decoder.js
          node --check camera-onnx-runtime.js
          node --test tests/hornet-onnx-decoder.test.cjs
          node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
      - name: Offline-PWA-Dateien bereitstellen (ohne Deployment)
        run: |
          mkdir -p private-pwa/wissen
          # Experimental ONNX runtime and decoder stay out of the private PWA until model rights and validation are approved.
          cp index.html datenschutz.html impressum.html style.css backup-contract.js app.js integrations-ui.js alert-rules.js alert-ui.js live-media.js field-dataset.js varroa-ui.js varroa.html sw.js manifest.webmanifest icon.svg private-pwa/
          cp wissen/wissenschaft-hornissen-bienen.html wissen/weltlage-vespa-velutina.html private-pwa/wissen/
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("private-pwa")
          service_worker = (root / "sw.js").read_text(encoding="utf-8")
          start = service_worker.find("const FILES=[")
          end = service_worker.find("];", start)
          if start < 0 or end < 0:
              raise SystemExit("Service-worker FILES list not found in private artifact")
          entries = re.findall(r"'([^']+)'", service_worker[start:end])
          for entry in entries:
              relative = entry.removeprefix("./")
              candidate = root / (relative if relative else "index.html")
              if not candidate.is_file():
                  raise SystemExit(f"Missing offline PWA shell asset: {entry}")
          PY
          printf '%s\n' 'Nur Build-Artefakt, keine gehostete Website.' 'ZIP-Dateien lassen sich auf iOS nicht direkt als installierbare PWA verwenden.' > private-pwa/README-PRIVAT.txt
      - name: Build nur als GitHub-Actions-Artefakt speichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vespaguard-private-pwa
          path: private-pwa/
          retention-days: 7
