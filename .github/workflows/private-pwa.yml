name: Privater PWA-Build (nur GitHub-Artefakt)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  private-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grundpruefungen
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
          node --check app.js
          node --check sw.js
          node --check hornet-onnx-decoder.js
          node --check camera-onnx-runtime.js
          node --test tests/hornet-onnx-decoder.test.cjs
          node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
      - name: Offline-PWA-Dateien bereitstellen (ohne Deployment)
        run: |
          mkdir -p private-pwa/wissen
          cp index.html datenschutz.html impressum.html style.css backup-contract.js app.js integrations-ui.js alert-rules.js alert-ui.js live-media.js hornet-onnx-decoder.js camera-onnx-runtime.js varroa-ui.js varroa.html sw.js manifest.webmanifest icon.svg private-pwa/
          cp wissen/wissenschaft-hornissen-bienen.html wissen/weltlage-vespa-velutina.html private-pwa/wissen/
          printf '%s\n' 'Nur Build-Artefakt, keine gehostete Website.' 'ZIP-Dateien lassen sich auf iOS nicht direkt als installierbare PWA verwenden.' > private-pwa/README-PRIVAT.txt
      - name: Build nur als GitHub-Actions-Artefakt speichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vespaguard-private-pwa
          path: private-pwa/
          retention-days: 7
