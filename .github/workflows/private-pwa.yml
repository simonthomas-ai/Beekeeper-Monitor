name: PWA-Buildvorschau (öffentliches Actions-Artefakt, kein Deployment)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pwa-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Grundpruefungen
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
          node --check app.js
          node --check field-image-privacy.js
          node --check field-dataset.js
          node --check sw.js
          node --check hornet-onnx-decoder.js
          node --check camera-onnx-runtime.js
          node --test tests/hornet-onnx-decoder.test.cjs
          node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
      - name: Offline-PWA-Dateien bereitstellen (ohne Deployment)
        run: |
          mkdir -p pwa-preview/wissen
          # Experimental ONNX runtime and decoder stay out of the PWA-Buildvorschau until model rights and validation are approved.
          cp index.html datenschutz.html impressum.html style.css backup-contract.js app.js integrations-ui.js alert-rules.js alert-ui.js live-media.js field-image-privacy.js field-dataset.js varroa-ui.js varroa.html sw.js manifest.webmanifest icon.svg pwa-preview/
          cp wissen/wissenschaft-hornissen-bienen.html wissen/weltlage-vespa-velutina.html pwa-preview/wissen/
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("pwa-preview")
          service_worker = (root / "sw.js").read_text(encoding="utf-8")
          start = service_worker.find("const FILES=[")
          end = service_worker.find("];", start)
          if start < 0 or end < 0:
              raise SystemExit("Service-worker FILES list not found in public build-preview artifact")
          entries = re.findall(r"'([^']+)'", service_worker[start:end])
          for entry in entries:
              relative = entry.removeprefix("./")
              candidate = root / (relative if relative else "index.html")
              if not candidate.is_file():
                  raise SystemExit(f"Missing offline PWA shell asset: {entry}")
          PY
          printf '%s\n' 'Öffentliches GitHub-Actions-Artefakt eines öffentlichen Repositories.' 'Jeder Repository-Leser kann dieses Artefakt herunterladen; es ist nicht privat. Es enthält nur statische App-Dateien, keine Benutzerfotos, GPS-Daten, Secrets oder Modellgewichte. Keine gehostete Website. Aufbewahrung: 7 Tage.' > pwa-preview/README-ARTEFAKT-HINWEIS.txt
      - name: Buildvorschau als öffentliches GitHub-Actions-Artefakt speichern
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vespaguard-pwa-preview
          path: pwa-preview/
          retention-days: 7
