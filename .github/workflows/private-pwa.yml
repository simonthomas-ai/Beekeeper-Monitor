name: PWA-Buildvorschau (manuell, nur lokaler Runner, kein Upload oder Deployment)
# The staging directory exists only on the ephemeral GitHub-hosted runner.
# This public repository must not publish the preview as an Actions artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Grundpruefungen
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
          node --check app.js
          node --check field-image-privacy.js
          node --check field-dataset.js
          node --check camera-model-selector.js
          node --test tests/camera-model-selector.unit.cjs
          node --check sw.js
          node --check hornet-onnx-decoder.js
          node --check camera-onnx-runtime.js
          node --test tests/hornet-onnx-decoder.test.cjs
          node --test tests/alert-rules.test.cjs tests/backup-contract.test.cjs
      - name: Offline-PWA-Dateien nur lokal im Runner bereitstellen
        run: |
          mkdir -p pwa-preview/wissen pwa-preview/models
          # Experimental ONNX runtime and decoder stay out of the preview until model rights and validation are approved.
          cp index.html datenschutz.html impressum.html style.css backup-contract.js app.js integrations-ui.js alert-rules.js alert-ui.js live-media.js field-image-privacy.js field-dataset.js camera-model-selector.js varroa-ui.js varroa.html sw.js manifest.webmanifest icon.svg pwa-preview/
          cp wissen/wissenschaft-hornissen-bienen.html wissen/weltlage-vespa-velutina.html pwa-preview/wissen/
          cp models/candidates.json pwa-preview/models/
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("pwa-preview")
          service_worker = (root / "sw.js").read_text(encoding="utf-8")
          start = service_worker.find("const FILES=[")
          end = service_worker.find("];", start)
          if start < 0 or end < 0:
              raise SystemExit("Service-worker FILES list not found in local PWA staging")
          entries = re.findall(r"'([^']+)'", service_worker[start:end])
          for entry in entries:
              relative = entry.removeprefix("./")
              candidate = root / (relative if relative else "index.html")
              if not candidate.is_file():
                  raise SystemExit(f"Missing offline PWA shell asset: {entry}")
          PY
      - name: Lokale Vorschau pruefen und danach verwerfen
        run: |
          test -s pwa-preview/index.html
          test -s pwa-preview/datenschutz.html
          test -s pwa-preview/impressum.html
          test -s pwa-preview/models/candidates.json
          test -s pwa-preview/wissen/wissenschaft-hornissen-bienen.html
          test -s pwa-preview/wissen/weltlage-vespa-velutina.html
          echo "PASS: PWA staging validated on the ephemeral runner; no artifact upload and no deployment."
