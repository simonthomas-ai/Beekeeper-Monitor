name: Parallel upstream integration intake
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/review_upstream_sources.py'
      - '.github/workflows/upstream-integration-intake.yml'
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shallow-clone all upstreams in parallel for isolated review
        run: python training/review_upstream_sources.py training/upstream-source-review.json
      - name: Upload provenance manifest only (no unreviewed third-party code)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-source-license-review
          path: training/upstream-source-review.json
          if-no-files-found: warn
          retention-days: 14
