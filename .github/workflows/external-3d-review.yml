name: External 3D asset provenance checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'training/inspect_external_glb.py'
      - 'training/test_inspect_external_glb.py'
      - '.github/workflows/external-3d-review.yml'
permissions:
  contents: read
jobs:
  validate-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test local GLB and provenance inspector
        run: python -m unittest discover -s training -p 'test_inspect_external_glb.py' -v
      - name: Confirm no unreviewed assets are auto-ingested
        run: |
          echo "No external models downloaded. No training approval granted."
