name: Verify CC0 discovery publishes no candidate artifacts
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Echte CC0-Bildquellen fuer KI pruefen
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gallery-original-artifact-audit.yml'
      - '.github/workflows/ki-cc0-quellen.yml'
      - '.github/workflows/pages.yml'
      - 'training/test_public_review_artifact_policy.py'
      - 'scripts/test_static.py'
      - 'review/index.html'
      - 'index.html'
      - 'docs/DEPLOYMENT.md'
      - 'training/DATASET-ANNOTATION-WORKFLOW.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gallery-original-artifact-audit.yml'
      - '.github/workflows/ki-cc0-quellen.yml'
      - '.github/workflows/pages.yml'
      - 'training/test_public_review_artifact_policy.py'
      - 'scripts/test_static.py'
      - 'review/index.html'
      - 'index.html'
      - 'docs/DEPLOYMENT.md'
      - 'training/DATASET-ANNOTATION-WORKFLOW.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: cc0-public-artifact-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-policy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify no public candidate artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout policy and workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fail-closed public media policy
        run: |
          python3 -m unittest training.test_public_review_artifact_policy -v
          python3 -m unittest training.test_audit_gallery_rights -v
      - name: Verify exact successful CC0 run has no artifacts
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/ki-cc0-quellen.yml?ref=${SOURCE_SHA}" --jq '.content' | base64 --decode)"
          if grep -q 'actions/upload-artifact@' <<< "$source_workflow"; then
            echo "::notice::This successful CC0 run predates the no-artifact policy; legacy artifacts are tracked separately for manual deletion."
            exit 0
          fi
          artifact_names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name')"
          if [[ -n "$artifact_names" ]]; then
            echo "::error::CC0 discovery run published an unexpected artifact."
            printf '%s\n' "$artifact_names"
            exit 1
          fi
          echo "Verified: source run ${SOURCE_RUN_ID} published no candidate metadata or image artifacts."
      - name: Record privacy boundary
        if: always()
        run: |
          {
            echo '## CC0 discovery publication policy'
            echo '- Public candidate image artifacts: none'
            echo '- Public candidate metadata artifacts: none'
            echo '- Public Pages deployment: not performed by this workflow'
            echo '- Discovery and image quality checks do not establish license validity, species identity or training approval.'
          } >> "$GITHUB_STEP_SUMMARY"
