name: Hornet3000 ONNX Integritaet und isolierte Inferenz
on:
  workflow_dispatch:
    inputs:
      multispecies_cc0:
        description: 'Vier Insektenarten mit echten CC0-Fotos vergleichen (Forschung)'
        type: boolean
        default: true
      real_cc0_photo:
        description: 'Echtes CC0-Hornissenfoto isoliert testen (kein Training)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ONNX-Parser fuer statische Graphpruefung
        run: python3 -m pip install --disable-pip-version-check 'onnx==1.19.1' 'onnxruntime==1.23.2'
      - name: YOLOv8 Decoder und NMS mit synthetischen Tensoren pruefen
        run: python3 -m unittest tests.test_hornet3000_decode -v
      - name: Gepinnte ONNX-Datei herunterladen und Byte-Identitaet pruefen
        run: python3 -m scripts.verify_hornet3000_onnx --download --inspect-graph --synthetic-inference
      - name: Echtes CC0-Foto mit frischer Lizenzkontrolle isoliert pruefen
        if: inputs.real_cc0_photo == true
        run: |
          python3 -m pip install --only-binary=:all: 'Pillow>=10,<13'
          python3 -m scripts.verify_hornet3000_onnx --download --real-cc0
      - name: Mehrere echte CC0-Insektenbilder isoliert vergleichen
        if: inputs.multispecies_cc0 == true
        run: |
          python3 -m pip install --only-binary=:all: 'Pillow>=10,<13'
          python3 -m scripts.verify_hornet3000_onnx --download --multispecies
      - name: Freigabe bleibt gesperrt
        run: |
          echo 'Nur isolierte CPU-Inferenz auf synthetischem Nullbild. Keine Lizenz-, Genauigkeits-, Kamera- oder Feldfreigabe.' >> "$GITHUB_STEP_SUMMARY"
