name: Hornet photo source discovery
on:
  workflow_dispatch:
    inputs:
      per_species:
        description: 'Maximum observations per species (1-50)'
        required: false
        default: '20'
        type: choice
        options: ['10', '20', '50']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find open-license candidate photo metadata
        run: python training/discover_inaturalist_candidates.py --per-species "${{ inputs.per_species || '20' }}"
      - name: Write one review summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, os
          from collections import Counter
          from pathlib import Path
          path = Path("training/inaturalist-review-queue.csv")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Hornet image candidate discovery\n\n")
              if not path.exists():
                  out.write("**FAILED:** No candidate file produced. Check the job log.\n")
              else:
                  with path.open(newline="", encoding="utf-8") as stream:
                      rows = list(csv.DictReader(stream))
                  out.write(f"**{len(rows)} UNREVIEWED candidate photos.** No images downloaded or training performed.\n\n")
                  for name, count in sorted(Counter(r["species_candidate"] for r in rows).items()):
                      out.write(f"- {name}: {count}\n")
                  out.write("\nDownload the CSV artifact to review each source and license version.\n")
          PY
      - name: Upload one review CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hornet-photo-review-queue
          path: training/inaturalist-review-queue.csv
          if-no-files-found: ignore
          retention-days: 14
