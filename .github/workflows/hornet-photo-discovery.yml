name: Insect photo source discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'training/discover_inaturalist_candidates.py'
      - 'training/inaturalist_media.py'
      - 'training/test_inaturalist_media.py'
      - 'training/prepare_visual_review_gallery.py'
      - 'training/test_prepare_visual_review_gallery.py'
      - 'training/import_authorized_images.py'
      - 'training/test_import_authorized_images.py'
      - '.github/workflows/hornet-photo-discovery.yml'
      - 'training/audit_inaturalist_candidates.py'
      - 'training/prepare_species_review.py'
      - 'training/prepare_annotation_tasks.py'
      - 'training/verify_inaturalist_photo_metadata.py'
      - 'training/prepare_hornet_visual_review.py'
      - 'training/render_hornet_review_gallery.py'
      - 'training/test_render_hornet_review_gallery.py'
      - 'training/test_hornet_license_audit.py'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test safe visual gallery rendering
        run: python -m unittest discover -s training -p 'test_render_hornet_review_gallery.py' -v
      - name: Install Pillow for offline image-import tests
        run: |
          python -m pip install --only-binary=:all: 'Pillow>=10,<13'
      - name: Test iNaturalist image resolution and importer safeguards
        run: |
          python -m unittest discover -s training -p 'test_inaturalist_media.py' -v
          python -m unittest discover -s training -p 'test_import_authorized_images.py' -v
          python -m unittest discover -s training -p 'test_audit_inaturalist_candidates.py' -v
          python -m unittest discover -s training -p 'test_prepare_hornet_visual_review.py' -v
          python -m unittest discover -s training -p 'test_prepare_visual_review_gallery.py' -v
      - name: Test fail-closed hornet license audit
        run: python -m unittest discover -s training -p 'test_hornet_license_audit.py' -v
      - name: Search up to 1000 licensed insect photo candidates
        run: python training/discover_inaturalist_candidates.py --target 1000 --max-pages 12
      - name: Audit candidate metadata quality
        run: python training/audit_inaturalist_candidates.py
      - name: Prepare species-grouped expert annotation queue
        run: python training/prepare_species_review.py
      - name: Generate traceable annotation tasks for human review
        run: python training/prepare_annotation_tasks.py
      - name: Recheck CC0 Vespa velutina photo metadata at iNaturalist
        run: |
          python training/verify_inaturalist_photo_metadata.py \
            --input training/inaturalist-review-queue.csv \
            --output training/vespa-velutina-cc0-source-audit.csv \
            --species 'Vespa velutina' --license CC0-1.0 --limit 100
      - name: Prepare larger-image visual review links
        run: |
          python training/prepare_hornet_visual_review.py \
            --input training/vespa-velutina-cc0-source-audit.csv \
            --output training/vespa-velutina-visual-review.csv
      - name: Render mobile-friendly read-only visual review gallery
        run: |
          python training/render_hornet_review_gallery.py \
            --input training/vespa-velutina-visual-review.csv \
            --output training/vespa-velutina-review-gallery.html
      - name: Summarize actual candidate counts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, os
          from collections import Counter
          from pathlib import Path
          path = Path("training/inaturalist-review-queue.csv")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Insect photo source discovery (target: 1000)\n\n")
              if not path.exists():
                  out.write("**FAILED:** No CSV generated; see job logs.\n")
              else:
                  with path.open(newline="", encoding="utf-8") as stream:
                      rows = list(csv.DictReader(stream))
                  out.write(f"**{len(rows)} / 1000 UNREVIEWED candidates** (one per observation). No images downloaded or trained.\n\n")
                  for name, count in sorted(Counter(row["species_candidate"] for row in rows).items()):
                      out.write(f"- {name}: {count}\n")
                  out.write("\nCC BY versions require verification. The CSV is a review queue, not approved training data.\n")
              audit = Path("training/vespa-velutina-cc0-source-audit.csv")
              if audit.exists():
                  with audit.open(newline="", encoding="utf-8") as stream:
                      checks = list(csv.DictReader(stream))
                  matched = sum(r["license_metadata_match"] == "YES" for r in checks)
                  errors = sum(bool(r["error"]) for r in checks)
                  out.write(f"\n**Vespa velutina CC0 source metadata:** {len(checks)} checked; {matched} API license-code matches; {errors} API errors. **0 visually or legally approved**.\n")
              else:
                  out.write("\n**Vespa velutina CC0 source audit missing:** check job logs.\n")
          PY
      - name: Upload review CSV
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: insect-photo-review-queue
          path: |
            training/inaturalist-review-queue.csv
            training/inaturalist-metadata-audit.json
            training/inaturalist-species-review.csv
            training/inaturalist-species-review.json
            training/inaturalist-annotation-tasks.csv
            training/inaturalist-annotation-tasks.json
            training/vespa-velutina-cc0-source-audit.csv
            training/vespa-velutina-visual-review.csv
            training/vespa-velutina-review-gallery.html
          if-no-files-found: ignore
          retention-days: 14
