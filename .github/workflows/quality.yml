name: Qualitaetsaudit - Quellen und Bildrechte
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quality.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 9 * * 1'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Pillow
        run: python -m pip install --only-binary=:all: 'Pillow>=10,<13'
      - name: Source and PWA contract
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python scripts/check_sources.py
          python scripts/test_static.py
          python scripts/check_pwa_deployment_contract.py
      - name: Image provenance and rights
        run: |
          python -m unittest training.test_audit_gallery_rights -v
          python -m unittest training.test_verify_inaturalist_photo_metadata training.test_discover_cc0_candidates training.test_audit_inaturalist_candidates training.test_download_original_inaturalist_images training.test_prepare_visual_review_gallery -v
      - name: JavaScript syntax
        run: |
          node --check backup-contract.js
          node --check app.js
          node --check sw.js
      - name: Generate quality report
        if: always()
        run: python scripts/quality_report.py
      - name: Upload report as Actions artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: beekeeper-quality-report
          path: quality-report.md
          if-no-files-found: warn
