name: Qualitaet Basispruefung
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/check_sources.py
      - run: python3 scripts/test_static.py
      - run: python3 scripts/check_pwa_deployment_contract.py
      - run: node --check app.js
      - run: node --check sw.js
      - run: python3 scripts/quality_report.py
      - run: python3 -m unittest training.test_audit_gallery_rights -v
      - run: python3 -m unittest training.test_provenance -v
      - name: iNaturalist Metadaten und CC0 Kandidaten pruefen
        run: python3 -m unittest training.test_verify_inaturalist_photo_metadata training.test_discover_cc0_candidates training.test_audit_inaturalist_candidates -v
      - name: Originalbild-Download und Review-Galerie pruefen
        run: python3 -m unittest training.test_download_original_inaturalist_images training.test_prepare_visual_review_gallery -v
