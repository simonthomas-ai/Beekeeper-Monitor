name: Project quality snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '11 9 * * 1'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify project source and static integrity
        run: |
          python scripts/check_sources.py
          python scripts/test_static.py
          python -m unittest training.test_audit_gallery_rights -v
          node --check backup-contract.js
          node --check app.js
          node --check sw.js
      - name: Generate evidence-based report
        if: always()
        run: python scripts/quality_report.py
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beekeeper-quality-report
          path: quality-report.md
          if-no-files-found: warn
