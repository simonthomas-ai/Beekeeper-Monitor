name: Bilddaten Fachfreigabe pruefen
on:
  pull_request:
    paths:
      - 'scripts/approve_training_manifest.py'
      - 'tests/test_approve_training_manifest.py'
      - '.github/workflows/image-approval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fachfreigabe-Sperren testen
        run: python -m unittest discover -s tests -p test_approve_training_manifest.py -v
