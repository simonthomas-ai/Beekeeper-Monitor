name: Resolve and verify npm lockfile
on:
  push:
    branches:
      - chore/generate-npm-lockfile-20261122
    paths:
      - 'package.json'
      - '.github/workflows/npm-lockfile-generator.yml'
permissions:
  contents: write
concurrency:
  group: npm-lockfile-generator
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lockfile work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/generate-npm-lockfile-20261122
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Resolve lockfile using npm registry metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean deterministic install from lockfile
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion !== 3) throw new Error('Expected npm lockfileVersion 3'); if(p.packages['node_modules/@playwright/test']?.version !== '1.65.1') throw new Error('Playwright lock mismatch'); console.log('Lockfile v3 and Playwright 1.65.1 verified')"
      - name: Commit generated lockfile to isolated work branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock.json change was produced."
            exit 1
          fi
          git commit -m "build: add npm lockfile generated by npm resolver"
          git push origin HEAD:chore/generate-npm-lockfile-20261122
