name: Validate PWA and integration services
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Checkout companion bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simonthomas-ai/BeeKeeper3000
          path: BeeKeeper3000
      - name: Install Pillow for original-image pipeline tests
        run: python -m pip install --only-binary=:all: 'Pillow>=10,<13'
      - name: Validate source catalog and PWA structure
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python scripts/check_sources.py
          python scripts/test_static.py
          python -m unittest training.test_audit_gallery_rights -v
          python -m unittest training.test_verify_inaturalist_photo_metadata training.test_discover_cc0_candidates training.test_audit_inaturalist_candidates training.test_download_original_inaturalist_images training.test_prepare_visual_review_gallery -v
          python -m unittest training.test_provenance -v
          python -m unittest training.test_import_authorized_images -v
          node --check app.js
          node --check integrations-ui.js
          node --check alert-rules.js
          node --check alert-ui.js
          node --test tests/alert-rules.test.cjs
          node --check sw.js
      - name: Test authenticated ingestion, persistence and bridge end-to-end
        env:
          BEEKEEPER_BRIDGE_ENTRY: ${{ github.workspace }}/BeeKeeper3000/monitor-bridge/bridge.mjs
        run: python -m unittest discover -s integrations -p 'test_*.py' -v
      - name: Test bridge adapter
        run: npm --prefix BeeKeeper3000/monitor-bridge test
