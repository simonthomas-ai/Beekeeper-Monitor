name: Validate PWA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source catalog and PWA structure
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python scripts/check_sources.py
          python scripts/test_static.py
          node --check app.js
          node --check sw.js
