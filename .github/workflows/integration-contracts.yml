name: VespaGuard integration contracts
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/**'
      - '.github/workflows/integration-contracts.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integration-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compile integration modules
        run: python -m compileall -q integrations
      - name: Run contract, storage, backup and HTTP security tests
        run: python -m unittest discover -s integrations -p 'test_*.py' -v
