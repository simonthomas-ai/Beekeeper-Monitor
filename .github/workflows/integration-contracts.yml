name: VespaGuard integration contracts
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/**'
      - '.github/workflows/integration-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile integration modules
        run: python -m compileall -q integrations
      - name: Run contract, storage and HTTP security tests
        run: python -m unittest discover -s integrations -p 'test_*.py' -v
