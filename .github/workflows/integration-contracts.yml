name: VespaGuard integration contracts
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/**'
      - '.github/workflows/integration-contracts.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integration-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile integration modules
        run: python -m compileall -q integrations
      - name: Run contract, storage, backup and HTTP security tests
        run: python -m unittest discover -s integrations -p 'test_*.py' -v
