name: VespaGuard integration contracts
on:
  workflow_dispatch:
  push:
    paths:
      - 'integrations/**'
      - '.github/workflows/integration-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify camera audio telemetry and Varroa contracts
        run: python -m unittest discover -s integrations -p 'test_*.py' -v
