name: Einmalig bestehende GitHub-Pages-Site entfernen
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-public-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  remove-public-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Bestehende GitHub-Pages-Site ueber API abschalten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/pages-delete-response --write-out '%{http_code}' \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == "204" ]]; then
            echo 'Bestehende GitHub-Pages-Site erfolgreich entfernt.'
          elif [[ "$status" == "404" ]]; then
            echo 'Keine GitHub-Pages-Site gefunden (bereits deaktiviert oder nicht vorhanden).'
          else
            echo "::error::Pages konnte nicht entfernt werden (HTTP $status)."
            cat /tmp/pages-delete-response
            exit 1
          fi
      - name: Ergebnis per GitHub API verifizieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/pages-check-response --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [[ "$status" == "404" ]]; then
            echo 'Verifiziert: GitHub Pages ist nicht konfiguriert.'
          else
            echo "::error::GitHub Pages noch vorhanden oder Verifikation unmoeglich (HTTP $status)."
            exit 1
          fi
