name: KiCad Leiterplatten-DRC
on:
  push:
    branches:
      - hardware/kicad-cli-drc-20261120
      - hardware/kicad-sensoradapter-v01-20261120
      - hardware/kicad-drc-rebuild-20261120
      - hardware/kicad-drc-finalize-20261120
      - main
      - fix/kicad-main-validation-20261120
    paths:
      - 'hardware/sensoradapter-v01/**'
      - '.github/workflows/kicad-drc.yml'
  pull_request:
    paths:
      - 'hardware/sensoradapter-v01/**'
      - '.github/workflows/kicad-drc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kicad-drc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Quellcode des ausloesenden Commits auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Geprueften Commit und Workflow anzeigen
        run: |
          git rev-parse HEAD
          git log -1 --format='%h %s'
          sed -n '1,100p' .github/workflows/kicad-drc.yml
      - name: KiCad 9 installieren und CLI-Faehigkeiten pruefen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          apt-cache policy kicad
          sudo apt-get install -y kicad
          command -v kicad-cli
          kicad-cli version
          kicad-cli pcb --help
          if ! kicad-cli pcb --help 2>&1 | grep -Eq '(^|[[:space:]])drc([[:space:]]|$)'; then
            echo "::error::Installiertes KiCad bietet kein 'pcb drc'. Pruefe Paketquelle und Version."
            exit 1
          fi
          kicad-cli pcb drc --help
          echo 'KiCad DRC-Unterbefehl verfuegbar.'
      - name: Unabhaengige PCB-Strukturpruefung
        run: python3 scripts/check_sensoradapter_structure.py
      - name: PCB-Designregelpruefung
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/kicad"
          cd hardware/sensoradapter-v01
          test -f fp-lib-table
          echo 'Verwendete Projekt-Footprintbibliothek:'
          cat fp-lib-table
          test -f Connector_PinHeader_2.54mm.pretty/PinHeader_1x04_P2.54mm_Vertical.kicad_mod
          # Headless KiCad CLI laedt bei diesem Board ohne .kicad_pro
          # die projektlokale Tabelle nicht automatisch. Wir registrieren
          # dieselbe eingecheckte Bibliothek mit absolutem Pfad global.
          mkdir -p "$HOME/.config/kicad/9.0"
          printf '(fp_lib_table\n  (version 7)\n  (lib (name "Connector_PinHeader_2.54mm")(type "KiCad")(uri "%s/Connector_PinHeader_2.54mm.pretty")(options "")(descr "VespaGuard project footprint"))\n)\n' "$PWD" > "$HOME/.config/kicad/9.0/fp-lib-table"
          cat "$HOME/.config/kicad/9.0/fp-lib-table"
          echo "KiCad nutzt die projektlokale Footprintbibliothek mit absolutem CI-Pfad."
          echo "DRC-Pruefung fuer Git-Commit: $(git rev-parse --short HEAD)"
          kicad-cli pcb drc \
            --output "$GITHUB_WORKSPACE/build/kicad/drc-report.txt" \
            --exit-code-violations \
            sensoradapter-v01.kicad_pcb
      - name: DRC-Bericht archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensoradapter-kicad-drc
          path: build/kicad/
          if-no-files-found: warn
