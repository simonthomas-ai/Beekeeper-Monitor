name: GBIF open media candidate discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'training/discover_gbif_media_candidates.py'
      - 'training/test_discover_gbif_media_candidates.py'
      - 'training/OPEN-DATA-SOURCES.md'
      - 'training/prepare_gbif_review_gallery.py'
      - 'training/test_prepare_gbif_review_gallery.py'
      - 'training/GBIF-MOBILE-REVIEW.md'
      - 'sources/catalog.json'
      - '.github/workflows/gbif-media-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'training/discover_gbif_media_candidates.py'
      - 'training/test_discover_gbif_media_candidates.py'
      - 'training/OPEN-DATA-SOURCES.md'
      - 'training/prepare_gbif_review_gallery.py'
      - 'training/test_prepare_gbif_review_gallery.py'
      - 'training/GBIF-MOBILE-REVIEW.md'
      - 'sources/catalog.json'
      - '.github/workflows/gbif-media-discovery.yml'
  schedule:
    - cron: '37 4 * * 2'

permissions:
  contents: read

concurrency:
  group: gbif-open-media-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test license filters, metadata contract and mobile GBIF gallery
        run: |
          python -m unittest training.test_discover_gbif_media_candidates -v
          python -m unittest training.test_prepare_gbif_review_gallery -v
      - name: Query the official GBIF API for licensed image metadata only
        if: github.event_name != 'pull_request'
        run: python training/discover_gbif_media_candidates.py --target 500 --max-pages 2 --limit 100 --pause 0.7 --allow-unavailable
      - name: Build mobile human review gallery from metadata-only GBIF queue
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          status_path = Path("training/gbif-media-discovery-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          found = status.get("found", 0)
          if found > 0:
              subprocess.run([
                  "python", "training/prepare_gbif_review_gallery.py",
                  "--input", "training/gbif-media-review-queue.csv",
                  "--output", "training/gbif-media-review-gallery.html",
              ], check=True, stdout=open("training/gbif-media-review-gallery-summary.json", "w", encoding="utf-8"))
          else:
              print("No GBIF metadata candidates; mobile review gallery not created.")
          PY
      - name: Summarize candidate status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("training/gbif-media-discovery-status.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"status":"unavailable","found":0}
          lines = [
              "## GBIF image-media discovery",
              "",
              f"- Status: **{data.get('status', 'unknown')}**",
              f"- Metadata candidates: **{data.get('found', 0)}**",
              f"- Mobile gallery: **{'created' if Path('training/gbif-media-review-gallery.html').is_file() else 'not created'}**",
              "- Image bytes downloaded or stored by workflow: **No**",
          ]
          diagnostics = data.get("diagnostics_by_species", {})
          if diagnostics:
              lines.extend(["", "### Per-species filtering diagnostics"])
              for species, stats in diagnostics.items():
                  lines.append(
                      f"- **{species}**: API count={stats.get('api_reported_occurrences', 0)}, "
                      f"records={stats.get('occurrence_records_returned', 0)}, "
                      f"exact species={stats.get('exact_species_key_and_name', 0)}, "
                      f"media={stats.get('media_objects', 0)}, "
                      f"still images={stats.get('still_image_media', 0)}, "
                      f"allowed media licence={stats.get('media_license_allowed', 0)}, "
                      f"allowed occurrence licence={stats.get('occurrence_license_allowed', 0)}, "
                      f"accepted={stats.get('accepted_candidates', 0)}"
                  )
                  lines.append(
                      f"  - Media licences: {json.dumps(stats.get('media_license_values', {}), ensure_ascii=False)}; "
                      f"occurrence licences: {json.dumps(stats.get('occurrence_license_values', {}), ensure_ascii=False)}; "
                      f"media types: {json.dumps(stats.get('media_type_values', {}), ensure_ascii=False)}"
                  )
          gallery_summary_path = Path("training/gbif-media-review-gallery-summary.json")
          if gallery_summary_path.is_file():
              gallery_summary = json.loads(gallery_summary_path.read_text(encoding="utf-8"))
              lines.extend([
                  "",
                  "### Mobile human-review gallery",
                  f"- GBIF records: **{gallery_summary.get('records', 0)}**",
                  f"- Original URLs embedded from allowlisted iNaturalist hosts: **{gallery_summary.get('inline_originals', 0)}**",
                  f"- External or unverified hosts not auto-embedded: **{gallery_summary.get('external_or_unverified_hosts', 0)}**",
                  "- Image bytes embedded in gallery/artifact: **0**",
                  "- Review annotations or approvals created: **0**",
              ])
          lines.extend([
              "- Model training performed: **No**",
              "- Candidate rights and image identification: **Not yet reviewed**",
          ])
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Preserve metadata review queue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gbif-media-review-queue
          path: |
            training/gbif-media-review-queue.csv
            training/gbif-media-discovery-status.json
            training/gbif-media-review-gallery.html
            training/gbif-media-review-gallery-summary.json
          if-no-files-found: ignore
          retention-days: 14
