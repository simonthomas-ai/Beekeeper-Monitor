name: Varroa download authorization guard (synthetic tests only)
on:
  push:
    paths:
      - '.github/workflows/varroa-verified-download.yml'
      - 'scripts/download_verified_varroa.py'
      - 'scripts/verify_varroa_source_blob.py'
      - 'data/model-sources/varrodetector-best.json'
      - 'tests/test_download_verified_varroa.py'
      - 'tests/test_varroa_download_workflow_policy.py'
  pull_request:
    paths:
      - '.github/workflows/varroa-verified-download.yml'
      - 'scripts/download_verified_varroa.py'
      - 'scripts/verify_varroa_source_blob.py'
      - 'data/model-sources/varrodetector-best.json'
      - 'tests/test_download_verified_varroa.py'
      - 'tests/test_varroa_download_workflow_policy.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test downloader authorization using synthetic bytes only
        run: python3 -m unittest discover -s tests -p test_download_verified_varroa.py -v
      - name: Enforce no-download workflow policy
        run: python3 -m unittest discover -s tests -p test_varroa_download_workflow_policy.py -v
