name: Autarke Projektsteuerung
run-name: Autarke Kontrolle – ${{ github.event_name }}
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
  issues: write
concurrency:
  group: autonomous-control
  cancel-in-progress: false
jobs:
  control:
    name: Projekt prüfen und Quellen erfassen
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install deterministic dependencies and audit npm advisories
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Validate immutable GitHub Actions and container pins
        run: |
          python3 -m unittest scripts.test_audit_workflow_action_pins -v
          python3 scripts/audit_workflow_action_pins.py
      - name: Validate static app
        id: static
        continue-on-error: true
        run: |
          python3 scripts/check_sources.py
          python3 scripts/test_static.py
          node --check app.js
          node --check sw.js
      - name: Run browser tests
        id: browser
        continue-on-error: true
        run: npm run test:e2e
      - name: Check training readiness
        id: readiness
        continue-on-error: true
        run: python3 scripts/model_readiness.py
      - name: Discover up to 1000 independent photo candidates
        id: discovery
        continue-on-error: true
        run: python3 training/discover_inaturalist_candidates.py --target 1000 --max-pages 12
      - name: Publish unified report
        if: always()
        env:
          STATIC_RESULT: ${{ steps.static.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          READINESS_RESULT: ${{ steps.readiness.outcome }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
        run: |
          python3 scripts/autonomous_control_report.py
      - name: Preserve test reports only (manual, public, one day)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonomous-control-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 1
      - name: Record failed checks as a GitHub issue
        if: ${{ always() && (steps.static.outcome != 'success' || steps.browser.outcome != 'success' || steps.readiness.outcome != 'success' || steps.discovery.outcome != 'success') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STATIC_RESULT: ${{ steps.static.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          READINESS_RESULT: ${{ steps.readiness.outcome }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
        with:
          script: |
            const title = '[Autarke Kontrolle] Fehlgeschlagene Projektprüfung';
            const results = {
              'Static app': process.env.STATIC_RESULT,
              'Browser tests': process.env.BROWSER_RESULT,
              'Training readiness script': process.env.READINESS_RESULT,
              'Photo discovery': process.env.DISCOVERY_RESULT
            };
            const failed = Object.entries(results).filter(([, result]) => result !== 'success');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automatisch durch die wöchentliche Projektsteuerung erfasst.',
              '',
              ...Object.entries(results).map(([name, status]) => `- ${name}: **${status}**`),
              '',
              `Protokolle und Artefakte: ${runUrl}`,
              '',
              'Bitte Ursache prüfen. Keine automatische Codeänderung oder Lizenzfreigabe.'
            ].join('\\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Erneuter Fehler: ${runUrl}\\n\\n${failed.map(([name, status]) => `- ${name}: ${status}`).join('\\n')}`
              });
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
      - name: Fail on incomplete checks
        if: always()
        env:
          STATIC_RESULT: ${{ steps.static.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          READINESS_RESULT: ${{ steps.readiness.outcome }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$READINESS_RESULT" = success
          test "$DISCOVERY_RESULT" = success
